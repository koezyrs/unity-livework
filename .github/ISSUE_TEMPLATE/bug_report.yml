name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove pairing codes, tokens, and `host.json` content from logs before you post them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start server
        2. Scan the QR code
        3. ...
    validations:
      required: true
  - type: input
    id: livework
    attributes:
      label: LiveWork version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: unity
    attributes:
      label: Unity version
      placeholder: 6000.3.11f1
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Android app
        - Chrome on Android
        - Chrome or Edge on desktop
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 15
  - type: dropdown
    id: input
    attributes:
      label: Active Input Handling
      options:
        - Input System
        - Input Manager (Old)
        - Both
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Unity Console messages or errors shown in the LiveWork window.
      render: text
